name: Runegrave foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  gate-a-browser:
    # Standard GitHub-hosted Linux image; actual Playwright Chromium is still mandatory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: python -m pip install playwright==1.56.0
      - name: Install real Chromium on GitHub's Ubuntu browser runner
        run: python -m playwright install chromium
        timeout-minutes: 7
      - run: python scripts/v00932_browser_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-a-v00932-bold-forms-large-stonefloor
          path: gate-a-v00932-*.png
          if-no-files-found: ignore
